<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:type" content="article">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<div class="wrap">
{{ content }}
<footer>
<p>{{ site.title }} &middot; {{ site.author }}. Draft. Citations are recorded in the <a href="{{ '/chapters/notes.html' | relative_url }}">notes</a>, including what remains unverified.</p>
</footer>
</div>
</body>
</html>
